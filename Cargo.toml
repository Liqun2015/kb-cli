[package]
name = "kb-cli"
version = "0.4.3"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lopdf = "0.32"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
regex = "1.10"

[[bin]]
name = "kb"
path = "src/main.rs"
